[package]
name = "lr1302"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "no_std, embassy-compatible HAL for the Semtech SX1302 / LR1302 LoRa gateway concentrator"
keywords = ["sx1302", "lora", "lorawan", "embassy", "embedded-hal"]
categories = ["embedded", "no-std", "hardware-support"]

[dependencies]
embedded-hal = "1.0"
embedded-hal-async = "1.0"
defmt = { version = "1.0.1", optional = true }

[features]
default = []
# Enable `defmt::Format` impls and defmt-based log output.
defmt = ["dep:defmt"]

[lints.rust]
# Generated code is huge; keep the noise down.
unused = "warn"
